<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <link rel="icon" href="data:,">
    <title>AgentLoom 初赛 Demo</title>
    <style>
      :root {
        --page: #0b0c0e;
        --surface: #15171a;
        --border: #34383f;
        --text: #f4f5f7;
        --muted: #aeb4bd;
        --accent: #ff6b35;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--page);
        color: var(--text);
        font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
        letter-spacing: 0;
      }

      body {
        min-height: 100dvh;
      }

      main {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        min-height: 100dvh;
      }

      header,
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.75rem 1rem;
        background: var(--surface);
      }

      header {
        border-bottom: 1px solid var(--border);
      }

      footer {
        border-top: 1px solid var(--border);
        color: var(--muted);
      }

      h1 {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 650;
      }

      p {
        margin: 0;
      }

      .meta {
        color: var(--muted);
        font-size: 0.875rem;
        text-align: right;
      }

      .player {
        display: grid;
        min-height: 0;
        background: #000;
      }

      video {
        width: 100%;
        height: 100%;
        max-height: calc(100dvh - 6.5rem);
        object-fit: contain;
        background: #000;
      }

      a {
        color: var(--text);
        text-decoration-color: var(--accent);
        text-underline-offset: 0.2rem;
      }

      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 0.25rem;
      }

      @media (max-width: 40rem) {
        header,
        footer {
          align-items: flex-start;
          flex-direction: column;
        }

        .meta {
          text-align: left;
        }

        video {
          max-height: calc(100dvh - 10rem);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>AgentLoom 初赛 Demo</h1>
        <p class="meta">3:41 · 379 passed / 0 skipped</p>
      </header>
      <section class="player" aria-label="AgentLoom 初赛演示视频">
        <video
          controls
          preload="metadata"
          playsinline
          poster="assets/agentloom-demo-poster.jpg"
          aria-label="播放 AgentLoom 初赛 Demo"
        >
          <source
            src="https://github.com/WilliamClifton-dev/AgentLoom/releases/download/v0.1.0/AgentLoom-v0.1.0-demo-final.mp4"
            type="video/mp4"
          >
          浏览器无法播放该视频。请使用下方下载链接。
        </video>
      </section>
      <footer>
        <p>公开证据录制 · SHA-256 EBADF02C634EB5F2…</p>
        <a href="https://github.com/WilliamClifton-dev/AgentLoom/releases/download/v0.1.0/AgentLoom-v0.1.0-demo-final.mp4">
          下载 MP4
        </a>
      </footer>
    </main>
  </body>
</html>
